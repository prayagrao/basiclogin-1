<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Booking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
  <!-- Top Buttons -->
  <div class="d-flex justify-content-end mb-4">
    <a href="/bookings" class="btn btn-secondary me-2">Back to Bookings</a>
    <a href="/logout" class="btn btn-danger">Logout</a>
  </div>

  <!-- Edit Booking Form -->
  <div class="card shadow p-4">
    <h2 class="text-center mb-4">Edit Booking</h2>

    <form th:action="@{/updateBooking}" method="post">
      <input type="hidden" th:name="id" th:value="${booking.id}" />

      <div class="mb-3">
        <label class="form-label">Vehicle Name</label>
        <input type="text" class="form-control" th:name="vehicleName" th:value="${booking.vehicleName}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Booking Date</label>
        <input type="date" class="form-control" th:name="bookingDate" th:value="${booking.bookingDate}" required>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-success">Update Booking</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
