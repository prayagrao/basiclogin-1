<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Add New Vehicle</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Add New Vehicle</h2>
    <form th:action="@{/saveVehicle}" method="post" enctype="multipart/form-data" th:object="${vehicle}">
        <input type="hidden" name="id" th:value="${vehicle.id}" />
        <div class="mb-3">
            <label for="vehicleName" class="form-label">Vehicle Name</label>
            <input type="text" class="form-control" id="vehicleName" th:field="*{name}" placeholder="Enter vehicle name" required>
        </div>

        <div class="mb-3">
            <label for="vehicleType" class="form-label">Vehicle Type</label>
            <input type="text" class="form-control" id="vehicleType" th:field="*{type}" placeholder="Enter vehicle type" required>
        </div>

        <div class="mb-3">
            <label for="pricePerDay" class="form-label">Price Per Day</label>
            <input type="number" class="form-control" id="pricePerDay" th:field="*{pricePerDay}" placeholder="Enter price per day" required>
        </div>

        <div class="mb-3">
            <label for="vehicleImage" class="form-label">Vehicle Image</label>
            <input type="file" class="form-control" id="vehicleImage" name="file" accept="image/*" required>
        </div>
        <input type="hidden" th:field="*{available}" value="true" />


        <button type="submit" class="btn btn-primary">Save Vehicle</button>
    </form>
</div>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
