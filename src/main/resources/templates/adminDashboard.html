<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Vehicle Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

  <!-- Welcome Admin -->
  <div class="mb-4 text-center">
    <h1>Admin Dashboard</h1>
  </div>

  <!-- Admin Control Buttons
  <div class="mb-4 text-center">
    <a href="/addVehicle" class="btn btn-success">Add New Vehicle</a>
    <a href="/logout" class="btn btn-danger ms-2">Logout</a>
  </div> -->

  <!-- All Bookings Section
  <div class="mb-5">
    <h2>All User Bookings</h2>
    <table class="table table-striped">
      <thead>
      <tr>
        <th>User</th>
        <th>Vehicle</th>
        <th>From Date</th>
        <th>To Date</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="booking : ${allBookings}">
        <td th:text="${booking.user.username}">Username</td>
        <td th:text="${booking.vehicleName}">Vehicle</td>
        <td th:text="${booking.fromDate}">Date</td>
        <td th:text="${booking.toDate}">Date</td>
      </tr>
      </tbody>
    </table>
  </div> -->
  <div class="mb-4 text-center">
    <a href="/addVehicle" class="btn btn-success">Add New Vehicle</a>
    <a href="/logout" class="btn btn-danger ms-2">Logout</a>
    <a href="/bookings" class="btn btn-primary ms-2">View Bookings</a> <!-- NEW LINK -->
  </div>

  <!-- All Vehicles Section -->
  <h2 class="text-center mb-4">Available Vehicles</h2>

  <div class="row" th:if="${vehicles != null}">
    <div class="col-md-4 mb-4" th:each="vehicle : ${vehicles}">
      <div class="card shadow-sm h-100">
        <img th:src="@{/vehicle/image/{id}(id=${vehicle.id})}" class="card-img-top" alt="Vehicle Image">
        <div class="card-body text-center">
          <h5 class="card-title" th:text="${vehicle.name}">Vehicle Name</h5>
          <p class="card-text">
            Type: <span th:text="${vehicle.type}"></span><br>
            Price/Day: $<span th:text="${vehicle.pricePerDay}"></span>
          </p>
          <form th:action="@{/uploadImage}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${vehicle.id}" />
            <div class="mb-2">
              <input type="file" name="file" class="form-control" accept="image/*" required />
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Upload New Image</button>
          </form>

          <div class="d-flex justify-content-center mt-3">
            <!-- Edit Button -->
            <a th:href="@{/editVehicle/{id}(id=${vehicle.id})}" class="btn btn-warning btn-sm me-2">Edit</a>

            <!-- Delete Button -->
            <form th:action="@{/deleteVehicle/{id}(id=${vehicle.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this vehicle?');">
              <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${vehicles == null or #lists.isEmpty(vehicles)}" class="text-center text-muted">
    <p>No vehicles available at the moment.</p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
