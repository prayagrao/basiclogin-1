<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Booking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
  <h2>Edit Booking</h2>

  <form th:action="@{/updateBooking}" th:object="${booking}" method="post">

    <!-- Hidden ID field -->
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
      <label for="vehicleName" class="form-label">Vehicle Name</label>
      <input type="text" id="vehicleName" th:field="*{vehicleName}" class="form-control" required />
    </div>

    <div class="mb-3">
      <label for="bookingDate" class="form-label">Booking Date</label>
      <input type="date" id="bookingDate" th:field="*{bookingDate}" class="form-control" required />
    </div>

    <button type="submit" class="btn btn-primary">Update Booking</button>
    <a href="/bookings" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
