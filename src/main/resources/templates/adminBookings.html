<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>All Bookings - Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
  <h1 class="text-center mb-4">All User Bookings</h1>

  <div class="mb-4 text-center">
    <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
  </div>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>User</th>
      <th>Vehicle</th>
      <th>From Date</th>
      <th>To Date</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="booking : ${allBookings}">
      <td th:text="${booking.user.username}">Username</td>
      <td th:text="${booking.vehicleName}">Vehicle Name</td>
      <td th:text="${booking.fromDate}">From Date</td>
      <td th:text="${booking.toDate}">To Date</td>
      <td>
        <a th:href="@{/editBooking1/{id}(id=${booking.id})}" class="btn btn-warning btn-sm me-2">Update</a>

        <form th:action="@{/deleteBooking1/{id}(id=${booking.id})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this booking?');">
          <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <div th:if="${#lists.isEmpty(allBookings)}" class="text-center text-muted">
    <p>No bookings available.</p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
