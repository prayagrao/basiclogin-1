<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Your Bookings</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

  <!-- Top Buttons -->
  <div class="d-flex justify-content-end mb-4">
    <a href="/dashboard" class="btn btn-secondary me-2">Back to Dashboard</a>
    <a href="/logout" class="btn btn-danger">Logout</a>
  </div>

  <!-- Welcome Message -->
  <div class="mb-4">
    <h1>Your Bookings, <span th:text="${username}">User</span>!</h1>
  </div>

  <!-- Bookings List -->
  <!-- Bookings List -->
  <div th:if="${bookings != null and !#lists.isEmpty(bookings)}">
    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center" th:each="booking : ${bookings}">
        <div>
          Vehicle: <span th:text="${booking.vehicleName}"></span> |
         <!-- Date: <span th:text="${booking.bookingDate}"></span> -->
          From: <span th:text="${booking.fromDate}"></span> |
          To: <span th:text="${booking.toDate}"></span>
        </div>
        <div>
          <!-- Edit Booking Button -->
          <a th:href="@{/editBooking/{id}(id=${booking.id})}" class="btn btn-warning btn-sm me-2">Edit</a>

          <!-- Delete Booking Button -->
          <form th:action="@{/deleteBooking/{id}(id=${booking.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this booking?');">Delete</button>
          </form>
        </div>
      </li>
    </ul>
  </div>


  <div th:if="${bookings == null or #lists.isEmpty(bookings)}" class="text-center text-muted">
    <p>No bookings found.</p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
