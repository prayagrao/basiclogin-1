<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>

<h1>Welcome, <span th:text="${username}">User</span>!</h1>

<h2>Your Bookings:</h2>
<ul>
    <li th:each="booking : ${bookings}">
        Vehicle: <span th:text="${booking.vehicleName}"></span> |
        Date: <span th:text="${booking.bookingDate}"></span>
    </li>
</ul>

<a href="/logout">Logout</a>

</body>
</html>
