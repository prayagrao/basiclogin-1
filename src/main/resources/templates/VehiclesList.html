<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Vehicles</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Available Vehicles</h2>
    <div>
        <p>Debug: vehicleTypes = <span th:text="${vehicleTypes}">[No Data]</span></p>
    </div>

    <!-- Vehicle Type Filter Dropdown -->
    <div class="mb-4 text-center" th:if="${vehicleTypes != null and !#lists.isEmpty(vehicleTypes)}">
        <form method="get" action="/vehiclesList">
            <select name="type" class="form-select w-auto d-inline">
                <option value="">All Types</option>
                <option th:each="type : ${vehicleTypes}"
                        th:value="${type}"
                        th:text="${type}"
                        th:selected="${selectedType == type}">
                </option>
            </select>
            <button type="submit" class="btn btn-outline-primary">Filter</button>
        </form>
    </div>

    <!-- Vehicle Cards -->
    <div class="row" th:if="${vehicles != null}">
        <div class="col-md-4 mb-4" th:each="vehicle : ${vehicles}">
            <div class="card shadow-sm h-100">
                <img th:src="@{/vehicle/image/{id}(id=${vehicle.id})}" class="card-img-top" alt="Vehicle Image">
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${vehicle.name}">Vehicle Name</h5>
                    <p class="card-text">
                        Type: <span th:text="${vehicle.type}"></span><br>
                        Price/Day: $<span th:text="${vehicle.pricePerDay}"></span>
                    </p>
                  <!--  <button class="btn btn-primary">Book Vehicle</button> -->
                 <!--   <form th:action="@{/bookVehicle}" method="post">
                        <input type="hidden" name="vehicleName" th:value="${vehicle.name}" />
                        <button type="submit" class="btn btn-primary">Book Vehicle</button>
                    </form> -->
                    <form th:action="@{/startBooking}" method="get">
                        <input type="hidden" name="vehicleName" th:value="${vehicle.name}" />
                        <button type="submit" class="btn btn-primary">Book Vehicle</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- No Vehicles Message -->
    <div th:if="${vehicles == null or #lists.isEmpty(vehicles)}" class="text-center text-muted">
        <p>No vehicles available for the selected type.</p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
